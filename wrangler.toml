# Cloudflare Worker settings. Cloudflare reads this file when it builds from GitHub.
# Leonard's passcode is NOT here: it's the LOG_PASSCODE secret, set in the Cloudflare dashboard.
name = "leonard-mini-marathon"
main = "src/worker.js"
compatibility_date = "2026-10-01"

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[kv_namespaces]]
binding = "MILES"
id = "28f73b6448f34db19637aa2cfc7161d9"

# Preview builds (one per pull request) get their own storage,
# so testing a change never touches Leonard's real miles.
[[previews.kv_namespaces]]
binding = "MILES"
id = "bc830a287641464e8fb2841c554007db"
